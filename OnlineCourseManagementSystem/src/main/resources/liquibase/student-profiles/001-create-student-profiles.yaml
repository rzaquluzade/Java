databaseChangeLog:

  - changeSet:
      id: 001-create-student-profiles
      author: rza.quluzade

      changes:

        - createTable:
            tableName: student_profiles

            columns:

              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: phone_number
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: address
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: birth_date
                  type: DATE

              - column:
                  name: student_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true

        - addForeignKeyConstraint:
            baseTableName: student_profiles
            baseColumnNames: student_id
            referencedTableName: students
            referencedColumnNames: id
            constraintName: fk_profile_student